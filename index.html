<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MediaRoundup</title>
<style>
  body { margin:0; background:#e9eef2; font:15px/1.5 Georgia, 'Times New Roman', serif; color:#142033; }
  .shell { max-width:680px; margin:48px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid #dce2e8; padding:38px 42px; }
  h1 { margin:0 0 4px; font:700 30px/1 Arial, Helvetica, sans-serif; letter-spacing:-1px; }
  .dek { color:#607087; font:13px/1.4 Arial, Helvetica, sans-serif; margin:0 0 26px; }
  input[type=password] { font:16px Georgia, serif; padding:10px 12px; border:1px solid #c9d4d9; width:220px; }
  button { font:600 14px Arial, Helvetica, sans-serif; color:#fff; background:#0b5d6b; border:0; padding:11px 20px; cursor:pointer; margin-left:8px; }
  .err { color:#a33; font:13px Arial, Helvetica, sans-serif; margin-top:10px; display:none; }
  .dates a { display:block; padding:13px 2px; border-bottom:1px solid #eef1f4; color:#0b5d6b; font:600 16px Arial, Helvetica, sans-serif; text-decoration:none; }
  .dates a:hover { background:#f4f7f9; }
  .back { display:inline-block; margin:0 0 14px; color:#0b5d6b; font:600 13px Arial, Helvetica, sans-serif; text-decoration:none; cursor:pointer; }
  #report { background:transparent; }
  #report .card-wrap { padding:0; }
  #readbar { position:fixed; top:0; left:0; right:0; background:#ffffffee; backdrop-filter:blur(6px); border-bottom:1px solid #dce2e8; z-index:50; display:none; }
  #readbar .inner { max-width:680px; margin:0 auto; padding:8px 16px 0; }
  #readbar .rb-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  #readbar .rb-title { font:700 15px/1 Arial, Helvetica, sans-serif; letter-spacing:-.3px; white-space:nowrap; }
  #readbar .rb-date { font:600 10px/1 Arial, Helvetica, sans-serif; color:#607087; text-transform:uppercase; letter-spacing:.8px; white-space:nowrap; }
  #tabs { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-top:6px; }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs a { flex:0 0 auto; font:600 11px/1 Arial, Helvetica, sans-serif; color:#607087; text-decoration:none; padding:7px 10px 9px; border-bottom:2px solid transparent; white-space:nowrap; }
  #tabs a.active { color:#0b5d6b; border-bottom-color:#b9872d; }
  #progress { height:3px; background:#eef1f4; }
  #progress div { height:100%; width:0%; background:#b9872d; transition:width .1s linear; }
  #nextbtn { position:fixed; right:18px; bottom:18px; z-index:50; display:none; background:#0b5d6b; color:#fff; font:600 12px/1 Arial, Helvetica, sans-serif; padding:11px 15px; border-radius:22px; text-decoration:none; box-shadow:0 2px 10px rgba(20,32,51,.25); max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #report .card-wrap { padding-top:0; }
  body.reading { padding-top:64px; }
</style>
</head>
<body>
<div class="shell" id="gate">
  <div class="card">
    <h1>MediaRoundup</h1>
    <p class="dek">Daily media intelligence for Sixpoint. Private review site.</p>
    <form id="pwform">
      <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Open</button>
    </form>
    <div class="err" id="err">That password did not work.</div>
  </div>
</div>
<div class="shell" id="list" style="display:none">
  <div class="card">
    <h1>MediaRoundup</h1>
    <p class="dek">Choose an edition.</p>
    <div class="dates" id="dates"></div>
  </div>
</div>
<div id="readbar"><div class="inner"><div class="rb-top"><span class="rb-title">MediaRoundup</span><span class="rb-date" id="rb-date"></span></div><div id="tabs"></div></div><div id="progress"><div id="progressfill"></div></div></div>
<a id="nextbtn" href="#"></a>
<div class="shell" id="report" style="display:none">
  <a class="back" id="back">&larr; All editions</a>
  <div class="card-wrap" id="reporthost"></div>
</div>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let PW = null, MANIFEST = null;

async function deriveKey(pw, salt, iter) {
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, mat,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decrypt(pw, blob) {
  const key = await deriveKey(pw, b64(blob.salt), blob.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct));
  return new TextDecoder().decode(pt);
}
async function fetchJson(path) { const r = await fetch(path, {cache:'no-store'}); return r.json(); }

async function unlock(pw) {
  const blob = await fetchJson('manifest.enc.json');
  MANIFEST = JSON.parse(await decrypt(pw, blob));  // throws on bad password
  PW = pw;
  try { sessionStorage.setItem('mrpw', pw); } catch (e) {}
  showList();
}
function showList() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('report').style.display = 'none';
  document.getElementById('list').style.display = '';
  const host = document.getElementById('dates');
  host.innerHTML = '';
  for (const entry of MANIFEST.dates) {
    const a = document.createElement('a');
    a.textContent = entry.label;
    a.href = '#' + entry.date;
    a.onclick = e => { e.preventDefault(); openDate(entry.date); };
    host.appendChild(a);
  }
}
async function openDate(date) {
  const blob = await fetchJson('reports/' + date + '.enc.json');
  const html = await decrypt(PW, blob);
  document.getElementById('list').style.display = 'none';
  const rep = document.getElementById('report');
  rep.style.display = '';
  const holder = document.getElementById('reporthost');
  holder.innerHTML = html;
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#' + date);
  enhanceReading(date);
}
let sections = [], spy = null;
function shortLabel(text) {
  return text.replace(/^\s*\d+\.\s*/, '')
    .replace("Today's Three Pitches",'Pitches')
    .replace('The Day in US News','US News')
    .replace('Jewish & Israel, National','Jewish & Israel')
    .replace('Israel to Mainstream','To Mainstream')
    .replace(' and the Midwest','').replace(' and South Florida','').replace('Washington, ','');
}
// The readbar is position:fixed, so scrolling a heading to the top of the viewport
// hides it underneath. scroll-margin-top is measured from the bar rather than
// hard-coded, because the tab row wraps to two lines on a narrow screen.
function readbarOffset() {
  const bar = document.getElementById('readbar');
  return (bar && bar.style.display !== 'none' ? bar.offsetHeight : 0) + 12;
}
function applyScrollMargin() {
  const pad = readbarOffset() + 'px';
  sections.forEach(s => { s.el.style.scrollMarginTop = pad; });
}
function enhanceReading(date) {
  const holder = document.getElementById('reporthost');
  // hide the report's own inline anchor row; the readbar replaces it
  const navRow = holder.querySelector('div > a[href^="#sec-"]');
  if (navRow && navRow.parentElement) navRow.parentElement.style.display = 'none';
  const heads = [...holder.querySelectorAll('[id^="sec-"]')];
  sections = heads.map(h => ({ id: h.id, el: h, label: shortLabel(h.textContent.trim()) }));
  const entry = MANIFEST.dates.find(d => d.date === date);
  document.getElementById('rb-date').textContent = entry ? entry.label : date;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  sections.forEach((s, i) => {
    const a = document.createElement('a');
    a.textContent = (i + 1) + '. ' + s.label;
    a.href = '#' + s.id;
    a.onclick = e => { e.preventDefault(); s.el.scrollIntoView({behavior:'smooth', block:'start'}); };
    tabs.appendChild(a);
  });
  document.getElementById('readbar').style.display = 'block';
  document.body.classList.add('reading');
  applyScrollMargin();
  window.addEventListener('resize', applyScrollMargin, {passive: true});
  if (spy) spy.disconnect();
  spy = new IntersectionObserver(() => updateSpy(), {rootMargin: '-70px 0px -60% 0px'});
  heads.forEach(h => spy.observe(h));
  window.addEventListener('scroll', updateSpy, {passive: true});
  updateSpy();
}
function currentSectionIndex() {
  let idx = 0;
  const y = window.scrollY + readbarOffset() + 8;
  sections.forEach((s, i) => { if (s.el.offsetTop <= y) idx = i; });
  return idx;
}
function updateSpy() {
  if (!sections.length || document.getElementById('report').style.display === 'none') return;
  const idx = currentSectionIndex();
  [...document.getElementById('tabs').children].forEach((a, i) => a.classList.toggle('active', i === idx));
  const active = document.getElementById('tabs').children[idx];
  if (active) active.scrollIntoView({inline:'nearest', block:'nearest'});
  const max = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('progressfill').style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + '%';
  const next = sections[idx + 1];
  const btn = document.getElementById('nextbtn');
  if (next) {
    btn.style.display = 'inline-block';
    btn.textContent = 'Next: ' + next.label + ' ↓';
    btn.onclick = e => { e.preventDefault(); next.el.scrollIntoView({behavior:'smooth', block:'start'}); };
  } else { btn.style.display = 'none'; }
}
function exitReading() {
  document.getElementById('readbar').style.display = 'none';
  document.getElementById('nextbtn').style.display = 'none';
  document.body.classList.remove('reading');
  if (spy) spy.disconnect();
  sections = [];
}
document.getElementById('back').onclick = () => { history.replaceState(null, '', '#'); exitReading(); showList(); };
document.getElementById('pwform').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  try { await unlock(pw); }
  catch (err) { document.getElementById('err').style.display = 'block'; }
};
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('mrpw'); } catch (e) {}
  if (saved) {
    try {
      await unlock(saved);
      const want = location.hash.replace('#','');
      if (want && MANIFEST.dates.some(d => d.date === want)) openDate(want);
    } catch (e) {}
  }
})();
</script>
</body>
</html>
